<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="1000" height="1000" role="img" aria-label="Structure Beats Magic">
  <!-- Medium publication AVATAR (square, 1000px, shows as a circle). -->
  <!-- The canonical 3x3 SBM mark (header, favicon, sbm-logo.svg), aligned 12 Oct 2026;
       replaced the earlier irregular 4x4 grid. Ink cells = #f7f8fa on this background. -->
  <defs><clipPath id="r"><circle cx="500" cy="500" r="500"/></clipPath></defs>
  <g clip-path="url(#r)">
    <rect width="1000" height="1000" fill="#0f172a"/>
    <rect x="200" y="200" width="180" height="180" rx="30" fill="#f7f8fa"/>
    <rect x="410" y="200" width="180" height="180" rx="30" fill="#2563eb"/>
    <rect x="620" y="200" width="180" height="180" rx="30" fill="#f7f8fa" opacity="0.35"/>
    <rect x="200" y="410" width="180" height="180" rx="30" fill="#2563eb" opacity="0.6"/>
    <rect x="410" y="410" width="180" height="180" rx="30" fill="#b88a1b"/>
    <rect x="620" y="410" width="180" height="180" rx="30" fill="#f7f8fa"/>
    <rect x="200" y="620" width="180" height="180" rx="30" fill="#f7f8fa" opacity="0.35"/>
    <rect x="410" y="620" width="180" height="180" rx="30" fill="#f7f8fa"/>
    <rect x="620" y="620" width="180" height="180" rx="30" fill="#2563eb" opacity="0.6"/>
  </g>
</svg>
